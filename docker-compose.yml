services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meshtastic
      MYSQL_USER: mesh
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mesh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-meshroot}
    ports:
      - "127.0.0.1:3308:3306" # for local dev / drizzle-kit only
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  app:
    build: .
    restart: unless-stopped
    profiles: [prod]
    env_file: .env
    environment:
      NUXT_DATABASE_URL: mysql://mesh:${MYSQL_PASSWORD:-mesh}@db:3306/meshtastic
    ports:
      # Put a reverse proxy (TLS) in front; set APP_BIND=0.0.0.0 to expose it directly
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
